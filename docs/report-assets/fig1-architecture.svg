<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Figure 1 - Lambda architecture for fleet operations</title>

  <!-- Blue = speed layer (fast, approximate). Amber = batch layer (exact, complete).
       Blue/amber is a colour-vision-deficiency-safe pair and survives greyscale printing,
       where the batch path also reads as the darker of the two. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1160" height="660" fill="#ffffff"/>

  <!-- ================= column headers ================= -->
  <g font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">
    <text x="20"  y="28">INGESTION</text>
    <text x="330" y="28">PROCESSING</text>
    <text x="700" y="28">STORAGE</text>
    <text x="940" y="28">SERVING</text>
  </g>
  <line x1="20" y1="38" x2="1140" y2="38" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= sources ================= -->
  <rect x="20" y="70" width="230" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="34" y="94" font-size="14" font-weight="700" fill="#0f172a">Telemetry simulator</text>
  <text x="34" y="114" font-size="11.5" fill="#475569">50 vehicles, event every 2 s</text>
  <text x="34" y="131" font-size="11.5" fill="#475569">GPS, status, fare</text>
  <text x="34" y="152" font-size="11" fill="#b45309" font-weight="600">faults injected on purpose</text>

  <rect x="20" y="410" width="230" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="34" y="434" font-size="14" font-weight="700" fill="#0f172a">Expense dropper</text>
  <text x="34" y="454" font-size="11.5" fill="#475569">1 CSV per simulated day</text>
  <text x="34" y="471" font-size="11.5" fill="#475569">fuel, maintenance, distance</text>
  <text x="34" y="488" font-size="11" fill="#b45309" font-weight="600">resubmittable as v2</text>

  <!-- ================= kafka ================= -->
  <rect x="285" y="70" width="120" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="345" y="100" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Kafka</text>
  <text x="345" y="120" font-size="11" fill="#1e40af" text-anchor="middle">6 partitions</text>
  <text x="345" y="136" font-size="11" fill="#1e40af" text-anchor="middle">key = vehicle_id</text>
  <text x="345" y="153" font-size="10.5" fill="#1e40af" text-anchor="middle">7-day retention</text>

  <line x1="252" y1="118" x2="281" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- landing dir -->
  <rect x="285" y="410" width="120" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="345" y="438" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">/landing</text>
  <text x="345" y="457" font-size="10.5" fill="#92400e" text-anchor="middle">atomic write</text>
  <line x1="252" y1="443" x2="281" y2="443" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>

  <!-- ================= archiver ================= -->
  <rect x="440" y="60" width="210" height="78" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="545" y="84" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">archiver</text>
  <text x="545" y="103" font-size="11" fill="#475569" text-anchor="middle">Spark Structured Streaming</text>
  <text x="545" y="122" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">no business logic</text>

  <!-- ================= speed layer ================= -->
  <rect x="440" y="162" width="210" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="545" y="186" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">speed layer</text>
  <g font-size="11" fill="#1e40af">
    <text x="456" y="208">validate &#8594; DLQ</text>
    <text x="456" y="226">dedup within watermark</text>
    <text x="456" y="244">zone enrichment</text>
    <text x="456" y="262">idle alerts (stateful)</text>
    <text x="456" y="280">hourly + daily aggregates</text>
  </g>
  <text x="545" y="302" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="600">watermark 10 sim min</text>

  <line x1="409" y1="105" x2="436" y2="99"  stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="409" y1="132" x2="436" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- ================= batch layer ================= -->
  <rect x="440" y="370" width="210" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="545" y="394" font-size="13.5" font-weight="700" fill="#7c2d12" text-anchor="middle">batch layer</text>
  <text x="545" y="412" font-size="10.5" fill="#92400e" text-anchor="middle">Airflow + PySpark</text>
  <g font-size="11" fill="#92400e">
    <text x="456" y="434">re-validate + full dedup</text>
    <text x="456" y="452">gps_km, utilization</text>
    <text x="456" y="470">join expenses (full outer)</text>
    <text x="456" y="488">profitability flags</text>
  </g>
  <text x="545" y="510" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="600">no watermark - complete day</text>

  <line x1="409" y1="443" x2="436" y2="443" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>

  <!-- ================= lake ================= -->
  <rect x="690" y="60" width="180" height="96" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="780" y="86" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Parquet lake</text>
  <text x="780" y="105" font-size="11" fill="#475569" text-anchor="middle">master dataset</text>
  <text x="780" y="123" font-size="11" fill="#475569" text-anchor="middle">partitioned by</text>
  <text x="780" y="139" font-size="11" fill="#475569" text-anchor="middle">event date</text>

  <line x1="654" y1="99" x2="686" y2="99" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- immutable master dataset -> batch layer (the recompute path) -->
  <path d="M 700 160 L 700 178 L 672 178 L 672 344 L 545 344 L 545 366" fill="none" stroke="#b45309"
        stroke-width="2.4" marker-end="url(#ao)"/>
  <rect x="487" y="326" width="176" height="17" fill="#ffffff"/>
  <text x="575" y="339" font-size="11" fill="#7c2d12" font-weight="700" text-anchor="middle">recompute any past day</text>

  <!-- ================= postgres ================= -->
  <rect x="690" y="230" width="180" height="180" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="780" y="256" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
  <rect x="706" y="272" width="148" height="56" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="780" y="292" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">rt_* tables</text>
  <text x="780" y="310" font-size="10" fill="#1e40af" text-anchor="middle">approximate, seconds old</text>
  <rect x="706" y="336" width="148" height="56" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="780" y="356" font-size="11.5" font-weight="700" fill="#7c2d12" text-anchor="middle">batch_* tables</text>
  <text x="780" y="374" font-size="10" fill="#92400e" text-anchor="middle">exact, complete</text>

  <line x1="654" y1="252" x2="686" y2="285" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="654" y1="452" x2="686" y2="380" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>

  <!-- ================= serving ================= -->
  <rect x="915" y="230" width="225" height="118" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1027" y="256" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">FastAPI</text>
  <text x="1027" y="277" font-size="11" fill="#475569" text-anchor="middle">merges both layers and</text>
  <text x="1027" y="293" font-size="11" fill="#475569" text-anchor="middle">labels every block with</text>
  <text x="1027" y="311" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">source: speed | batch</text>
  <text x="1027" y="333" font-size="10.5" fill="#475569" text-anchor="middle">never blended into one figure</text>

  <line x1="874" y1="300" x2="911" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="915" y="372" width="225" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1027" y="396" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Grafana</text>
  <text x="1027" y="415" font-size="10.5" fill="#475569" text-anchor="middle">operations + pipeline health</text>
  <line x1="1027" y1="352" x2="1027" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="915" y="452" width="225" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1027" y="476" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Prometheus + Alertmanager</text>
  <text x="1027" y="495" font-size="10.5" fill="#475569" text-anchor="middle">10 rules &#8594; API webhook</text>
  <line x1="1027" y1="434" x2="1027" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- daily report output -->
  <rect x="915" y="60" width="225" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="1027" y="86" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Daily profitability report</text>
  <text x="1027" y="106" font-size="11" fill="#92400e" text-anchor="middle">HTML + CSV per simulated day</text>
  <text x="1027" y="124" font-size="11" fill="#92400e" text-anchor="middle">per-vehicle reconciliation</text>
  <text x="1027" y="143" font-size="10.5" fill="#92400e" text-anchor="middle">served at /reports/{date}</text>
  <path d="M 650 445 L 670 445 L 670 176 L 1027 176 L 1027 160" fill="none"
        stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>

  <!-- ================= legend ================= -->
  <g transform="translate(20, 556)">
    <rect x="0" y="0" width="620" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="16" y="16" width="26" height="12" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="50" y="26" font-size="11.5" fill="#0f172a">
      <tspan font-weight="700">Speed path</tspan> - seconds old, approximate, drops late events
    </text>
    <rect x="16" y="40" width="26" height="12" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="50" y="50" font-size="11.5" fill="#0f172a">
      <tspan font-weight="700">Batch path</tspan> - exact, complete, recomputable when a supplier resubmits
    </text>
    <rect x="16" y="64" width="26" height="12" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
    <text x="50" y="74" font-size="11.5" fill="#0f172a">
      <tspan font-weight="700">Shared</tspan> - the immutable master dataset both layers depend on
    </text>
  </g>

  <text x="670" y="580" font-size="11.5" fill="#475569">Both layers import every shared rule</text>
  <text x="670" y="598" font-size="11.5" fill="#475569">from the shared common/ package</text>
  <text x="670" y="616" font-size="11.5" fill="#475569">(clock, zones, validation, distance,</text>
  <text x="670" y="632" font-size="11.5" fill="#475569">fares, profitability flags) - the mitigation</text>
  <text x="670" y="648" font-size="11.5" fill="#475569">for Lambda's two-codebase problem.</text>

  <text x="20" y="652" font-size="11" fill="#94a3b8">
    Figure 1 - System architecture. Simulated clock: 1 real second = 1 simulated minute (1 simulated day = 24 real minutes).
  </text>
</svg>
