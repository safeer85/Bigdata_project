# Loads every dashboard JSON committed under observability/grafana/dashboards.
apiVersion: 1

providers:
  - name: fleet
    orgId: 1
    folder: Fleet
    type: file
    disableDeletion: false
    # Editing a dashboard in the UI and reloading must not silently discard the
    # committed version; updateIntervalSeconds re-reads the files instead.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
